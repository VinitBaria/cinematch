name: cinematch-ai

services:
  # ── 1. Database: MongoDB ──
  mongodb:
    image: mongo:7.0
    container_name: cinematch_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cinematch-network
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 2. Backend API & ML Recommendation Engine ──
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cinematch_backend
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=cinematch_ai
      - JWT_SECRET_KEY=cinematch-ai-super-secret-production-jwt-key
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_MINUTES=1440
      - APP_ENV=production
      - PROJECT_ROOT=/app
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./ml/artifacts:/app/ml/artifacts
      - ./data:/app/data
    networks:
      - cinematch-network

  # ── 3. Frontend: React + Vite Single Page Application ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinematch_frontend
    restart: unless-stopped
    networks:
      - cinematch-network

  # ── 4. API Gateway & Reverse Proxy (Rate Limiting + Gzip) ──
  nginx:
    image: nginx:alpine
    container_name: cinematch_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - cinematch-network

  # ── 5. Prometheus Monitoring ──
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: cinematch_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - cinematch-network

  # ── 6. Grafana Visualization Dashboard ──
  grafana:
    image: grafana/grafana:10.3.1
    container_name: cinematch_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - cinematch-network

volumes:
  mongo_data:
    name: cinematch_mongo_data
  prometheus_data:
    name: cinematch_prometheus_data
  grafana_data:
    name: cinematch_grafana_data

networks:
  cinematch-network:
    name: cinematch_network
    driver: bridge

