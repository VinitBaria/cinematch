global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: "cinematch_backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000", "host.docker.internal:8000"]
        labels:
          app: "cinematch-ai"
          env: "development"
